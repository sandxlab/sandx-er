[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sandx-er"
version = "0.1.0.dev0"
description = "Entity Resolution infrastructure for fragmented, noisy, large-scale datasets"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SandX Lab", email = "research@sandx.io" }]
requires-python = ">=3.10"
keywords = ["entity-resolution", "record-linkage", "deduplication", "probabilistic", "infrastructure"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
embed = ["sandx-embed>=0.1"]
dev   = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage      = "https://sandx.io"
Documentation = "https://sandx.io/docs"
Repository    = "https://github.com/sandxlab/sandx-er"
"Bug Tracker" = "https://github.com/sandxlab/sandx-er/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
